{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header text-white" style="background: linear-gradient(90deg, #20925d, #034325);">
      <h5 class="mb-0">Change Password</h5>
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="old_password" class="form-label">Old Password</label>
          <input type="password" class="form-control" id="old_password" name="old_password" required>
        </div>
        <div class="mb-3">
          <label for="new_password1" class="form-label">New Password</label>
          <input type="password" class="form-control" id="new_password1" name="new_password1" required>
        </div>
        <div class="mb-3">
          <label for="new_password2" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="new_password2" name="new_password2" required>
        </div>
        <button type="submit" class="btn" style="background: linear-gradient(90deg, #20925d, #034325); color: white;">Change Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
